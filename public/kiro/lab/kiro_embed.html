  if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}

let WOB=1;
function outline(p,t,id,sx,sy){
  const [rx,ry,flat,ca,ch,cw,th,tw,lean,hook,notch]=p,pts=[],n=80;
  for(let i=0;i<n;i++){const a=i/n*6.2832;let r=1+(.028*Math.sin(3*a+t*1.3+id*2)+.022*Math.sin(5*a-t*.9+id)+.015*Math.sin(2*a+t*.7))*WOB;
    const d=Math.atan2(Math.sin(a-ca),Math.cos(a-ca)),d2=Math.atan2(Math.sin(a-ca-hook*.5),Math.cos(a-ca-hook*.5));
    r+=ch*Math.exp(-d*d/Math.max(.02,cw))+th*.6*Math.exp(-d2*d2/Math.max(.01,tw))*(1+Math.sin(t*2.3+id)*.07);
    if(notch>0){const dn=Math.atan2(Math.sin(a-ca-.55),Math.cos(a-ca-.55));r-=notch*Math.exp(-dn*dn/.02)}
    let x=Math.cos(a)*rx*r,y=Math.sin(a)*ry*r;if(y>0)y=ry*Math.pow(Math.sin(a),1-flat*.7)*r;
    x+=-y*lean*.55;pts.push([x*sx,y*sy])}
  return pts}

 orgulloso:{n:'Orgulloso',g:'Emociones',d:'Barbilla arriba, mirada hacia lo alto, párpados de “yo gané”.',pL:'huevo',pR:'huevo',T:{lid:.3,tilt:-.2,pup:1.1,scale:1.06,bounce:.12},look:'smug',puff:true,dur:4},
 ansioso:{n:'Ansioso',g:'Emociones',d:'Ojos algo más chicos, pupilas pequeñas, mirada nerviosa y temblor.',T:{scale:.94,pup:.72,jit:.04,bounce:.5},look:'fast',dur:4},

const AUTO=['curioso','feliz','triste','enojado','amor','sorprendido','orgulloso','ansioso','hype','mareado','frio','bostezo','guino','cara-llena','pantalla','bateria-baja','dormido','electrico'];

const FEEL={'Gelatina':[1,1],'Suave':[.7,1.45],'Caricatura':[1.6,.85]};
let cur='despierto',cr,mir=false,mouse=null,eyes,parts=[],charge=.15,E={bt:[],b:1.5,sc:1,fl:4,w:12,sz:9,sl:20,u:0,ex:0,look:'normal',part:null,blinkOK:true,slowB:false,beat:null,flash:false,meter:null,sideX:0};

// ===== personalidad base EXOTICA: cada criatura trae sus propias formas de ojo y de pupila =====
function genEyeExo(){const crest=Math.random()<.78;return[R(30,46),R(42,58),R(.05,.42),R(-2.35,-.75),crest?R(.12,.6):R(0,.12),R(.16,.5),crest?R(.2,1.05):R(0,.25),R(.028,.058),R(-.5,.5),R(-.8,.8),Math.random()<.35?R(.1,.32):0,R(-8,8)]}
function mirrorExo(a){const b=a.slice();b[3]=-Math.PI-a[3];b[8]=-a[8];b[9]=-a[9];b[11]=-a[11];return b}
function jitEye(a,k){return a.map((v,i)=>i===3?v+R(-.12,.12)*k:i===11?v+R(-2,2)*k:v*(1+R(-.07,.07)*k))}
function genPair(){const A=genEyeExo(),m=Math.random();let B;
  if(O.parejos==='igual')B=A.slice();
  else if(O.parejos==='casi')B=jitEye(A,1);
  else if(m<.32)B=mirrorExo(A).map((v,k)=>v*(k<2?R(.94,1.06):1));
  else if(m<.58)B=A.map((v,k)=>k===3||k===11?v+R(-.35,.35):v*R(.84,1.16));
  else B=genEyeExo();return[A,B]}
function genPup(){const r=Math.random();let q;
  if(r<.22)q={fx:R(.38,.5),fy:R(.38,.5),a:R(.01,.07)};                 // redonda
  else if(r<.40)q={fx:R(.33,.43),fy:R(.56,.74),a:R(.02,.1)};           // alta
  else if(r<.72)q={fx:R(.54,.68),fy:R(.5,.64),a:R(.08,.2)};            // grande irregular (como la de pantalla de color)
  else if(r<.84)q={fx:R(.58,.7),fy:R(.34,.45),a:R(.04,.12)};           // ancha
  else q={fx:R(.4,.55),fy:R(.42,.58),a:R(.12,.2)};                    // chica muy irregular
  q.p2=R(0,6.3);q.p3=R(0,6.3);q.p4=R(0,6.3);q.sk=R(-.22,.22);return q}
function pupPair(){const A=genPup();let B;const m=Math.random();
  if(m<.5)B={...A,p2:A.p2+R(-1,1),p3:A.p3+R(-1,1),p4:A.p4+R(-1,1),sk:-A.sk,fx:A.fx*R(.92,1.08),fy:A.fy*R(.92,1.08)};
  else B=genPup();return[A,B]}
function genPupExo(eye){const q=(Math.random()<.5&&eye)?eye.map((v,k)=>k===3||k===11?v+R(-.3,.3):v*R(.8,1.2)):genEyeExo();q[4]*=.65;q[6]*=.55;return q}
function pupPath(rx,ry,q,t){rx=Math.max(.6,rx);ry=Math.max(.6,ry);const N=44;g.beginPath();
  for(let i=0;i<N;i++){const a=i/N*TAU,r=1+q.a*(.6*Math.sin(2*a+q.p2+t*.5)+.8*Math.sin(3*a+q.p3-t*.4)+.5*Math.sin(4*a+q.p4+t*.3)),x=Math.cos(a)*rx*r+q.sk*Math.sin(a)*ry,y=Math.sin(a)*ry*r;i?g.lineTo(x,y):g.moveTo(x,y)}g.closePath()}

function persona(){const t=[];if(cr.curious>.6)t.push('curiosa');if(cr.energy>1.2)t.push('enérgica');if(cr.sleepy>.65)t.push('dormilona');if(cr.grumpy>.65)t.push('gruñona');if(cr.shy>.65)t.push('tímida');
